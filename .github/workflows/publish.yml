name: build and publish podman images to github package

on:
  push:
    branches:
      - master
      - main
  
  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend-image-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout backend project
        uses: actions/checkout@v4

      - name: login into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghrc.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup buildx
        uses:  docker/setup-buildx-action@v3

      - name: build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/podlab-backend:latest

      - name: build and push frontend
        uses: docker/build-push-action@v6
        with:
         context: ./frontend
         file: ./frontend/Containerfile
         push: true
         tags: ghcr.io/${{ github.repository_owner }}/podlab-frontend:latest

      - name: build and push notification
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          file: ./services/notification/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/podlab-notification-service:latest