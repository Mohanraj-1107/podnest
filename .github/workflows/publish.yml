name: build and publish podman images to github package

on:
  push:
    branches:
      - master
      - main
  
  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: podnest
  
jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout backend project
        uses: actions/checkout@v4


      - name: Set lowercase image prefix
        run: | 
            echo "IMAGE_PREFIX=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: login into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup buildx
        uses:  docker/setup-buildx-action@v3

      - name: build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{env.REGISTRY}}/${{env.IMAGE_PREFIX}}/${{env.IMAGE_BASE_NAME}}-backend:latest

      - name: build and push frontend
        uses: docker/build-push-action@v6
        with:
         context: ./frontend
         file: ./frontend/Containerfile
         push: true
         tags: ${{env.REGISTRY}}/${{env.IMAGE_PREFIX}}/${{env.IMAGE_BASE_NAME}}-frontend:latest

      - name: build and push notification
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          file: ./services/notification/Containerfile
          push: true
          tags: ${{env.REGISTRY}}/${{env.IMAGE_PREFIX}}/${{env.IMAGE_BASE_NAME}}-notification-service:latest